name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STATEBACK_POSTGRES_HOST: 127.0.0.1
  STATEBACK_POSTGRES_PORT: "5432"
  STATEBACK_POSTGRES_DB: stateback
  STATEBACK_POSTGRES_USER: stateback
  STATEBACK_POSTGRES_PASSWORD: stateback_dev_only
  STATEBACK_DATABASE_URL: postgresql+psycopg://stateback:stateback_dev_only@127.0.0.1:5432/stateback
  STATEBACK_NATS_URL: nats://127.0.0.1:4222
  STATEBACK_NATS_MONITOR_URL: http://127.0.0.1:8222

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src tests
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Whitespace
        run: git diff --check

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Start local infrastructure
        run: docker compose up -d --wait
      - name: Integration tests
        env:
          STATEBACK_RUN_INTEGRATION: "1"
        run: uv run pytest -m integration
      - name: Alembic upgrade head
        run: uv run alembic upgrade head

  release-surfaces:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Build Python package
        run: uv build
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file /tmp/stateback-requirements.txt
          uv run pip-audit --strict --requirement /tmp/stateback-requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test and build frontend
        working-directory: frontend
        run: npm test -- --run && npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high
      - name: Derive release image version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          runtime_version="$(uv run python -c 'import stateback; print(stateback.__version__)')"
          frontend_version="$(node -p "require('./frontend/package.json').version")"
          test "$package_version" = "$runtime_version"
          test "$runtime_version" = "$frontend_version"
          printf 'STATEBACK_VERSION=%s\n' "$runtime_version" >> "$GITHUB_ENV"
      - name: Scan source, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Validate production Compose
        env:
          STATEBACK_DATABASE_OWNER_PASSWORD_FILE: deploy/examples/database-owner-password.example
          STATEBACK_DATABASE_RUNTIME_PASSWORD_FILE: deploy/examples/database-runtime-password.example
          STATEBACK_DATABASE_MIGRATION_URL_FILE: deploy/examples/database-migration-url.example
          STATEBACK_DATABASE_RUNTIME_URL_FILE: deploy/examples/database-runtime-url.example
          STATEBACK_NATS_CONFIG_FILE: deploy/examples/nats.conf.example
          STATEBACK_NATS_BOOTSTRAP_URL_FILE: deploy/examples/nats-bootstrap-url.example
          STATEBACK_NATS_URL_FILE: deploy/examples/nats-url.example
          STATEBACK_POLICY_CONFIG_FILE: deploy/examples/policy.json.example
          STATEBACK_AUTH_CONFIG_FILE: deploy/examples/auth.json.example
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build runtime image
        run: docker build --build-arg STATEBACK_VERSION="$STATEBACK_VERSION" -f deploy/Dockerfile -t "ghcr.io/mominrkhan/stateback:$STATEBACK_VERSION" .
      - name: Build frontend image
        run: docker build --build-arg STATEBACK_VERSION="$STATEBACK_VERSION" -f deploy/frontend.Dockerfile -t "ghcr.io/mominrkhan/stateback-frontend:$STATEBACK_VERSION" .
      - name: Report all runtime image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mominrkhan/stateback:${{ env.STATEBACK_VERSION }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Block fix-available runtime image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mominrkhan/stateback:${{ env.STATEBACK_VERSION }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Report all frontend image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mominrkhan/stateback-frontend:${{ env.STATEBACK_VERSION }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Block fix-available frontend image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mominrkhan/stateback-frontend:${{ env.STATEBACK_VERSION }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify production Compose
        run: deploy/verify-compose.sh
