[project]
name = "stateback"
version = "0.1.0"
description = "Transactional safety for AI agent side effects."
keywords = [
    "ai-agents",
    "distributed-systems",
    "fault-tolerance",
    "idempotency",
    "recovery",
    "transactions",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp==2.0.0",
    "nats-py==2.15.0",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.41.0",
]

[project.urls]
Homepage = "https://github.com/mominrkhan/stateback"
Repository = "https://github.com/mominrkhan/stateback"
Documentation = "https://github.com/mominrkhan/stateback/tree/main/docs"
Issues = "https://github.com/mominrkhan/stateback/issues"

[project.scripts]
stateback = "stateback.cli.main:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateback"]
exclude = ["src/stateback/**/*.md"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
only-include = ["src/stateback", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["src/stateback/**/*.md"]

[dependency-groups]
dev = [
    "mkdocs==1.6.1",
    "pip-audit==2.10.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.12.5"
package = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["stateback", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
packages = ["stateback"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "unit: deterministic tests with no local infrastructure",
    "integration: tests that require local PostgreSQL or NATS",
    "postgres: tests that require PostgreSQL",
    "nats: tests that require NATS JetStream",
    "failure: deterministic failure-model and crash-boundary tests",
    "contract: canonical contract serialization and enum tests",
    "github_sandbox: opt-in tests that mutate an isolated GitHub repository",
    "benchmark_correctness: deterministic benchmark correctness evidence",
    "benchmark_performance: reproducible benchmark performance measurements",
]
