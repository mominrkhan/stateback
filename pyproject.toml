[project]
name = "stateback"
version = "0.0.0"
description = "Transactional safety for AI agent side effects."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "nats-py==2.15.0",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateback"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.12.5"
package = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["stateback", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
packages = ["stateback"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "unit: deterministic tests with no local infrastructure",
    "integration: tests that require local PostgreSQL or NATS",
    "postgres: tests that require PostgreSQL",
    "nats: tests that require NATS JetStream",
    "failure: reserved for later phases; do not use in Phase 2",
    "contract: canonical contract serialization and enum tests",
]
